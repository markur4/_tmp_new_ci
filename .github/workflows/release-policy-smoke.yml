name: Release policy smoke test

on:
  push:
    tags:
      - "ci-policy-*"

concurrency:
  group: ci-smoke-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  policy:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      require_ci: ${{ steps.policy.outputs.require_ci }}
    steps:
      - uses: actions/checkout@v5
      - uses: extractions/setup-just@v4
        with:
          just-version: "1.56.0"
      - id: policy
        shell: bash
        run: |
          value="$(just --evaluate RELEASE_REQUIRE_CI)"
          [[ "$value" == true || "$value" == false ]] || {
            echo "Invalid RELEASE_REQUIRE_CI: $value" >&2
            exit 1
          }
          echo "require_ci=$value" >> "$GITHUB_OUTPUT"

  checks:
    if: github.event_name == 'push' && needs.policy.outputs.require_ci == 'true'
    needs: policy
    runs-on: ubuntu-latest
    steps:
      - name: Dummy hosted check
        run: echo "Dummy hosted check passed."

  release:
    if: >-
      github.event_name == 'push' && always() && needs.policy.result == 'success' &&
      (needs.policy.outputs.require_ci == 'false' || needs.checks.result == 'success')
    needs: [policy, checks]
    runs-on: ubuntu-latest
    steps:
      - name: Confirm dummy release path
        run: echo "Dummy release policy path passed; no release was created."
